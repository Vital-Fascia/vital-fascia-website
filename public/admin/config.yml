# Sveltia CMS configuration for the Vital Fascia website.
# Docs: https://github.com/sveltia/sveltia-cms
# Keep this in sync with src/content.config.ts (the content schemas).
#
# LOCAL EDITING (no login needed): run `npm run dev`, open http://localhost:4321/admin/
# in Chrome or Edge, click "Work with Local Repository" and pick this project folder.

backend:
  name: github
  repo: Vital-Fascia/vital-fascia-website
  branch: main
  # URL of the deployed sveltia-cms-auth Cloudflare Worker (handles GitHub login).
  base_url: https://sveltia-cms-auth.getjameswebb.workers.dev

site_url: https://www.vitalfascia.com.au
display_url: https://www.vitalfascia.com.au
locale: en

# Photos are stored in ONE folder that both Astro and the CMS use: src/assets/uploads.
# Each collection below sets media_folder relative to the content files in src/content/,
# so image paths are saved as ../assets/uploads/photo.jpg (what Astro's image optimiser needs).
media_folder: src/assets/uploads

collections:
  # ---------------------------------------------------------------- HOME PAGE
  - name: home_page
    media_folder: ../assets/uploads
    label: Home page
    label_singular: Home page section
    description: Each section of the home page, from top to bottom. Pick a section to edit its wording and photos.
    files:
      - name: hero
        label: "1. Top banner (Hero)"
        file: src/content/hero.yaml
        fields:
          - { name: eyebrow, label: Small line above the headline, widget: string, hint: "Short label, e.g. the type of therapy and where you are." }
          - { name: headingStart, label: Headline - first part, widget: string, hint: "The big headline is built from three parts so one word can be shown in italics. Keep the trailing space." }
          - { name: headingEmphasis, label: Headline - italic word, widget: string, hint: "This word is shown in italics and green." }
          - { name: headingEnd, label: Headline - last part, widget: string, hint: "Keep the leading space." }
          - { name: intro, label: Introduction paragraph, widget: text }
          - name: primaryButton
            label: Main button
            widget: object
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Where it goes, widget: string, hint: "Use # to use the booking link from Contact details." }
          - name: secondaryButton
            label: Second button
            widget: object
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Where it goes, widget: string, hint: "Use #resource to scroll to the free guide, or #approach for the approach section." }
          - { name: photo, label: Photo, widget: image, required: false, choose_url: false, hint: "Portrait-shaped photo works best (4:5). Until you add one, a grey placeholder is shown." }
          - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false, hint: "Describe what is in the photo, e.g. 'Alex treating a client's shoulder'. Important for accessibility and Google." }
          - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }

      - name: highlights
        label: "2. Key numbers (dark band under the top banner)"
        file: src/content/highlights.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true, hint: "Switch off to hide the numbers. Only show figures that are true and up to date." }
          - name: items
            label: Numbers
            label_singular: number
            widget: list
            summary: "{{fields.value}} - {{fields.label}}"
            fields:
              - { name: value, label: Number or figure, widget: string, hint: "e.g. 500+" }
              - { name: label, label: What it means, widget: string, hint: "e.g. Sessions delivered" }

      - name: whoItsFor
        label: "3. Who it's for"
        file: src/content/who-its-for.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - name: signs
            label: "'Does this sound like you?' points"
            label_singular: point
            widget: list
            field: { name: text, label: Point, widget: string }
            hint: "Short sentences describing what your clients experience. Drag to re-order."
          - { name: closing, label: Closing line, widget: text }
          - { name: photo, label: Photo, widget: image, required: false, choose_url: false, hint: "Natural-light lifestyle photo (a desk worker or runner). Cropped to fit; portrait or square works best." }
          - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false }
          - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }

      - name: services
        label: "4. Services & treatments"
        file: src/content/services.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: issues
            label: Common issues
            label_singular: issue
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Issue, widget: string }
              - { name: icon, label: Icon, widget: select, default: posture, options: [{ label: Neck & shoulders, value: neck }, { label: Lower back, value: back }, { label: Hips, value: hips }, { label: Running, value: running }, { label: Posture, value: posture }, { label: Mobility, value: mobility }] }
              - { name: description, label: Short description, widget: text }
          - { name: treatmentsStartOpen, label: "'How I work' starts open", widget: boolean, default: false, hint: "Visitors can always open or close this part. Off = collapsed until they open it." }
          - { name: treatmentsEyebrow, label: Small line above the treatments heading, widget: string }
          - { name: treatmentsHeading, label: Treatments heading, widget: string }
          - name: treatments
            label: Treatments
            label_singular: treatment
            widget: list
            summary: "{{fields.name}}"
            fields:
              - { name: name, label: Treatment name, widget: string }
              - { name: icon, label: Icon, widget: select, default: massage, options: [{ label: Massage, value: massage }, { label: Web (myofascial), value: web }, { label: Target (trigger point), value: target }, { label: Cup, value: cup }, { label: Needle, value: needle }, { label: Exercise, value: exercise }] }
              - { name: description, label: One-line description, widget: string, hint: "Shown in the list. Aim for one sentence." }
              - { name: detail, label: Longer description, widget: text, hint: "2-3 lines shown next to the photo when this treatment is selected." }
              - { name: photo, label: Photo, widget: image, required: false, choose_url: false, hint: "Landscape photo (4:3) works best." }
              - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false }
              - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }

      - name: approach
        label: "5. My approach"
        file: src/content/approach.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: startOpen, label: Starts open, widget: boolean, default: true, hint: "Visitors can always open or close this section. Off = collapsed until they open it." }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: body, label: Paragraph, widget: text }
          - { name: diagramTitle, label: Diagram title, widget: string }
          - { name: diagramHint, label: Instruction under the diagram, widget: string }
          - { name: figureTitle, label: Diagram description (for screen readers), widget: string }
          - name: regions
            label: Body areas on the diagram
            label_singular: area
            widget: list
            summary: "{{fields.label}}"
            hint: "Seven areas sit on the figure. Only edit the wording; don't change the area ID."
            fields:
              - { name: id, label: Area ID (don't change), widget: select, options: [jaw, neck, upperback, core, hip, knee, ankle] }
              - { name: label, label: Name shown, widget: string }
              - { name: symptom, label: Symptom button this area selects, widget: select, options: [{ label: Neck tension, value: neck-tension }, { label: Jaw clenching, value: jaw-clenching }, { label: Lower back pain, value: lower-back-pain }, { label: Knee pain, value: knee-pain }] }
          - name: symptoms
            label: Symptom buttons
            label_singular: symptom
            widget: list
            summary: "{{fields.label}}"
            hint: "The first one is shown when the page loads. Keep the four IDs."
            fields:
              - { name: id, label: Symptom ID (don't change), widget: select, options: [neck-tension, jaw-clenching, lower-back-pain, knee-pain] }
              - { name: label, label: Button text, widget: string }
              - { name: nodes, label: Body areas that light up (top to bottom), widget: list, field: { name: node, label: Area ID, widget: select, options: [jaw, neck, upperback, core, hip, knee, ankle] } }
              - { name: caption, label: One-line explanation, widget: text, hint: "Shown under the figure." }
          - { name: diagramCaption, label: Closing line, widget: string }
          - { name: compareHeading, label: Comparison heading, widget: string }
          - name: compareLeft
            label: Comparison - left column
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: points, label: Points, widget: list, field: { name: text, label: Point, widget: string } }
          - name: compareRight
            label: Comparison - right column
            widget: object
            fields:
              - { name: title, label: Title, widget: string }
              - { name: points, label: Points, widget: list, field: { name: text, label: Point, widget: string } }

      - name: process
        label: "6. How it works (process)"
        file: src/content/process.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: startOpen, label: Starts open, widget: boolean, default: false, hint: "Visitors can always open or close this section. Off = collapsed until they open it." }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - name: steps
            label: Steps (in order)
            label_singular: step
            widget: list
            summary: "{{fields.title}}"
            hint: "Steps are numbered automatically. Eight fits the layout best (two rows of four)."
            fields:
              - { name: title, label: Step name, widget: string }
              - { name: icon, label: Icon, widget: select, default: compass, options: [{ label: Conversation, value: conversation }, { label: Posture, value: posture }, { label: Hands, value: hands }, { label: Movement, value: movement }, { label: Compass, value: compass }, { label: Massage, value: massage }, { label: Web, value: web }, { label: Target, value: target }, { label: Cup, value: cup }, { label: Needle, value: needle }, { label: Exercise, value: exercise }, { label: Neck, value: neck }, { label: Back, value: back }, { label: Hips, value: hips }, { label: Running, value: running }, { label: Mobility, value: mobility }] }
              - { name: description, label: Description, widget: text }
              - { name: detail, label: Extra line shown on hover (optional), widget: string, required: false, hint: "e.g. 'What you leave with: ...'" }

      - name: offers
        label: "7. Pricing & offers"
        file: src/content/offers.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: items
            label: Offers (cards)
            label_singular: offer
            widget: list
            summary: "{{fields.title}} ({{fields.status}})"
            hint: "Each offer is a card. Set the status to 'Coming soon' for a teaser card or 'Available now' for a full card."
            fields:
              - { name: status, label: Status, widget: select, options: [{ label: Available now, value: active }, { label: Coming soon, value: soon }] }
              - { name: badge, label: Badge, widget: string, hint: "e.g. Available now" }
              - { name: title, label: Title, widget: string }
              - { name: details, label: Length and location, widget: string, required: false }
              - { name: description, label: Description (used by coming-soon cards), widget: text, required: false }
              - { name: price, label: Price, widget: string, required: false, hint: "Include the dollar sign, e.g. $150. [$XXX] is a placeholder." }
              - { name: priceNote, label: Text after the price, widget: string, required: false, hint: "e.g. ' per session'. Keep the leading space." }
              - name: includes
                label: What's included (or what it will include)
                label_singular: item
                widget: list
                required: false
                field: { name: text, label: Item, widget: string }
              - name: expect
                label: What to expect (short facts)
                label_singular: fact
                widget: list
                required: false
                summary: "{{fields.label}}: {{fields.value}}"
                fields:
                  - { name: label, label: Label, widget: string, hint: "e.g. Duration, What to wear" }
                  - { name: value, label: Value, widget: string }
              - { name: rebate, label: Health fund / rebate line, widget: string, required: false, hint: "e.g. 'Rebates available with most health funds (HICAPS)'. Only add once confirmed." }
              - { name: photo, label: Photo (coming-soon cards), widget: image, required: false, choose_url: false }
              - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false }
              - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }
              - { name: buttonLabel, label: Button text, widget: string }
              - { name: buttonHref, label: Button goes to, widget: string, hint: "Use # to use the booking link from Contact details." }
          - { name: faqHeading, label: Questions heading, widget: string }
          - name: faqs
            label: Frequently asked questions
            label_singular: question
            widget: list
            summary: "{{fields.question}}"
            fields:
              - { name: question, label: Question, widget: string }
              - { name: answer, label: Answer, widget: text }

      - name: testimonials
        label: "8. Client testimonials"
        file: src/content/testimonials.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true, hint: "Only publish real testimonials, with the client's permission. They appear in a slider with arrows and dots." }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: items
            label: Testimonials
            label_singular: testimonial
            widget: list
            summary: "{{fields.name}} - {{fields.quote}}"
            fields:
              - { name: quote, label: What they said, widget: text, hint: "Don't add quote marks - they are added automatically." }
              - { name: name, label: First name, widget: string }
              - { name: detail, label: Job or age (optional), widget: string, required: false }
              - { name: source, label: Where it came from (optional), widget: string, required: false, hint: "e.g. Via Google" }
              - { name: rating, label: Star rating, widget: number, value_type: int, min: 1, max: 5, default: 5 }

      - name: about
        label: "9. About"
        file: src/content/about.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: pullQuote, label: Pull-quote from Alex, widget: text, hint: "Shown in large type above the story." }
          - name: paragraphs
            label: Story (one entry per paragraph)
            label_singular: paragraph
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: signature, label: Sign-off, widget: string }
          - { name: photo, label: Portrait photo, widget: image, required: false, choose_url: false, hint: "Portrait-shaped photo works best (3:4)." }
          - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false }
          - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }

      - name: discoveryCall
        label: "10. Free discovery call"
        file: src/content/discovery-call.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - name: paragraphs
            label: Text (one entry per paragraph)
            label_singular: paragraph
            widget: list
            field: { name: text, label: Paragraph, widget: text }
          - { name: stepsHeading, label: "'What happens next' heading", widget: string }
          - name: steps
            label: What happens next (in order)
            label_singular: step
            widget: list
            field: { name: text, label: Step, widget: string }
          - { name: nameLabel, label: Name box - label, widget: string }
          - { name: namePlaceholder, label: Name box - example text, widget: string }
          - { name: phoneLabel, label: Phone box - label, widget: string }
          - { name: phonePlaceholder, label: Phone box - example text, widget: string }
          - { name: emailLabel, label: Email box - label, widget: string }
          - { name: emailPlaceholder, label: Email box - example text, widget: string }
          - { name: buttonLabel, label: Button text, widget: string }
          - { name: finePrint, label: Small print under the button, widget: string }
          - { name: successMessage, label: Message shown after sending, widget: string }

      - name: finalCta
        label: "11. Final call to action"
        file: src/content/final-cta.yaml
        fields:
          - { name: visible, label: Show this section on the website, widget: boolean, default: true }
          - { name: heading, label: Heading, widget: string }
          - { name: text, label: Supporting line, widget: text }
          - { name: buttonLabel, label: Button text, widget: string }
          - { name: photo, label: Background photo, widget: image, required: false, choose_url: false, hint: "Full-width photo shown behind the text under a dark overlay." }
          - { name: photoAlt, label: Photo description (for screen readers), widget: string, required: false }
          - { name: photoPlaceholder, label: Placeholder text (shown only until a photo is added), widget: string, required: false }

  # -------------------------------------------------------------- OTHER PAGES
  - name: other_pages
    media_folder: ../assets/uploads
    label: Other pages
    files:
      - name: programPage
        label: 8-Week Program page
        file: src/content/program-page.yaml
        fields:
          - { name: badge, label: Badge, widget: string, hint: "e.g. Coming soon" }
          - { name: heading, label: Page heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - name: primaryButton
            label: Main button
            widget: object
            fields:
              - { name: label, label: Button text, widget: string }
              - { name: href, label: Where it goes, widget: string, hint: "Leave as #waitlist to scroll to the sign-up form." }
          - { name: includesHeading, label: "'What's included' heading", widget: string }
          - name: includes
            label: What's included
            label_singular: item
            widget: list
            summary: "{{fields.title}}"
            fields:
              - { name: title, label: Title, widget: string }
              - { name: description, label: Description, widget: text }
          - { name: forWhoHeading, label: "'Who it's for' heading", widget: string }
          - { name: forWhoText, label: Who it's for, widget: text }
          - { name: detailsHeading, label: "'Details' heading", widget: string }
          - name: details
            label: Details (length, price, etc.)
            label_singular: detail
            widget: list
            summary: "{{fields.label}}: {{fields.value}}"
            fields:
              - { name: label, label: Label, widget: string }
              - { name: value, label: Value, widget: string }
          - { name: waitlistHeading, label: Waitlist heading, widget: string }
          - { name: waitlistText, label: Waitlist text, widget: text }
          - { name: nameLabel, label: Name box - label, widget: string }
          - { name: emailLabel, label: Email box - label, widget: string }
          - { name: buttonLabel, label: Button text, widget: string }
          - { name: finePrint, label: Small print under the button, widget: string }
          - { name: successMessage, label: Message shown after signing up, widget: string }

      - name: legal
        label: Legal pages (privacy, terms, refunds, site map)
        file: src/content/legal.yaml
        fields:
          - name: privacy
            label: Privacy Policy
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: sections
                label: Sections
                label_singular: section
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: terms
            label: Terms of Service
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: sections
                label: Sections
                label_singular: section
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: refund
            label: Refund Policy
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: intro, label: Introduction, widget: text }
              - name: sections
                label: Sections
                label_singular: section
                widget: list
                summary: "{{fields.heading}}"
                fields:
                  - { name: heading, label: Heading, widget: string }
                  - { name: body, label: Text, widget: text }
          - name: sitemap
            label: Site map page
            widget: object
            fields:
              - { name: title, label: Page title, widget: string }
              - { name: intro, label: Introduction, widget: text }

      - name: contactPage
        label: Contact page (message form)
        file: src/content/contact-page.yaml
        fields:
          - { name: eyebrow, label: Small line above the heading, widget: string }
          - { name: heading, label: Heading, widget: string }
          - { name: intro, label: Introduction, widget: text }
          - { name: nameLabel, label: Name box - label, widget: string }
          - { name: emailLabel, label: Email box - label, widget: string }
          - { name: phoneLabel, label: Phone box - label, widget: string }
          - { name: messageLabel, label: Message box - label, widget: string }
          - { name: messageHint, label: Hint under the message box, widget: string }
          - { name: buttonLabel, label: Button text, widget: string }
          - { name: successMessage, label: Message shown after sending, widget: string }

  # ----------------------------------------------------------------- SETTINGS
  - name: settings
    media_folder: ../assets/uploads
    label: Business details & settings
    files:
      - name: contact
        label: Contact details & opening hours
        file: src/content/contact.yaml
        fields:
          - name: addressLines
            label: Address (one line per entry)
            label_singular: line
            widget: list
            field: { name: line, label: Address line, widget: string }
          - name: hours
            label: Opening hours
            label_singular: row
            widget: list
            summary: "{{fields.days}}: {{fields.time}}"
            hint: "Shown as a small table in the website footer."
            fields:
              - { name: days, label: Days, widget: string, hint: "e.g. Monday - Friday" }
              - { name: time, label: Hours, widget: string, hint: "e.g. 7:00am - 6:00pm, or Closed" }
          - { name: mapEmbedUrl, label: Google Maps embed link, widget: string, required: false, hint: "In Google Maps: Share > Embed a map > copy the address inside src=\"...\". Leave empty to hide the map." }
          - { name: mapLinkUrl, label: Google Maps directions link, widget: string, required: false, hint: "A normal Google Maps link for the 'Get directions' text." }
          - { name: email, label: Email address, widget: string }
          - { name: instagramHandle, label: Instagram name, widget: string, hint: "e.g. @thefasciaguy" }
          - { name: instagramUrl, label: Instagram link, widget: string }
          - { name: facebookUrl, label: Facebook link, widget: string, required: false, hint: "Not shown on the website at the moment." }
          - { name: tiktokUrl, label: TikTok link, widget: string, required: false, hint: "Leave empty to hide the icon." }
          - { name: whatsappUrl, label: WhatsApp link, widget: string, required: false, hint: "e.g. https://wa.me/61449637920 (country code, no + or spaces). Leave empty to hide the icon." }
          - { name: bookingUrl, label: Online booking link (Cliniko), widget: string, hint: "Every 'Book' button on the site goes here." }
          - { name: bookingLabel, label: Booking button text (footer), widget: string }
          - { name: requestCallLabel, label: Request-a-call button text (footer), widget: string }
          - { name: hoursHeading, label: "'Opening hours' heading (footer)", widget: string }
          - { name: visitHeading, label: "'Visit' heading", widget: string }
          - { name: getInTouchHeading, label: "'Get in touch' heading", widget: string }

      - name: site
        label: Website name, menu & footer
        file: src/content/site.yaml
        fields:
          - { name: businessName, label: Business name, widget: string }
          - { name: tagline, label: Tagline, widget: string }
          - name: navLinks
            label: Menu links (in order)
            label_singular: link
            widget: list
            summary: "{{fields.label}}"
            hint: "Use /#about style links to jump to a section on the home page."
            fields:
              - { name: label, label: Text in the menu, widget: string }
              - { name: href, label: Where it goes, widget: string, hint: "e.g. /#about, /contact or /8-week-program" }
              - { name: tag, label: Small tag next to the link (optional), widget: string, required: false, hint: "e.g. Coming soon" }
          - { name: bookButtonLabel, label: Booking button text, widget: string }
          - { name: bookButtonShortLabel, label: Booking button text on small phones, widget: string, hint: "A shorter version, e.g. Book" }
          - { name: menuNote, label: Small line under the booking button in the phone menu, widget: string }
          - { name: footerNote, label: Text after the copyright, widget: string }
