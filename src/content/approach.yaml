visible: true
startOpen: true
eyebrow: The approach
heading: Your body doesn't work in isolation. Neither should your treatment.
body: Fascia links muscles, joints and organs into one continuous, whole-body network. That’s why where you feel tension isn’t always the whole story. Rather than only chasing the sore spot, we look at how your whole system moves, holds and compensates, then work with the pattern, not just the symptom.
diagramTitle: One connected system
diagramHint: Tap a body area or a symptom to see how it connects.
figureTitle: A back view of the body with a line of fascia linking the jaw, neck, upper back, lower back, hip, knee and ankle.
regions:
  - id: jaw
    label: Jaw
    symptom: jaw-clenching
  - id: neck
    label: Neck & Shoulders
    symptom: neck-tension
  - id: upperback
    label: Upper back
    symptom: neck-tension
  - id: core
    label: Spine & Core
    symptom: lower-back-pain
  - id: hip
    label: Hips
    symptom: lower-back-pain
  - id: knee
    label: Knees
    symptom: knee-pain
  - id: ankle
    label: Feet
    symptom: knee-pain
symptoms:
  - id: neck-tension
    label: Neck tension
    nodes:
      - jaw
      - neck
      - upperback
    caption: Neck tension is often tied to the jaw and the upper back, not just the neck.
  - id: jaw-clenching
    label: Jaw clenching
    nodes:
      - jaw
      - neck
    caption: Jaw clenching often travels down into the neck and shoulders, and tension there can feed back into the jaw.
  - id: lower-back-pain
    label: Lower back pain
    nodes:
      - upperback
      - core
      - hip
      - knee
    caption: Lower back pain often involves the glutes, hamstrings and lats, which are all connected through the fascia.
  - id: knee-pain
    label: Knee pain
    nodes:
      - core
      - hip
      - knee
      - ankle
    caption: Knee pain is often driven by the hips above and the ankle and foot below.
diagramCaption: For general education only, not a diagnosis. If pain is new, severe, follows an injury, or comes with other symptoms, please see your GP first.
compareHeading: Two ways to approach pain
compareLeft:
  title: Symptom Focus
  points:
    - Treats wherever it hurts today
    - Centres on the session itself
    - You return when it flares up
compareRight:
  title: Whole-pattern Focus
  points:
    - Looks at where it hurts and how you move around it
    - Pairs hands-on work with tools you can use at home
    - Education-led, so you understand your body better
