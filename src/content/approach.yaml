  - { id: neck, label: Neck & shoulders, related: [jaw, upper-back, core], caption: "Neck tension is often tied to the jaw and the upper back, not just the neck." }
  - { id: upper-back, label: Upper back, related: [neck, core, hips], caption: "A stiff upper back makes the neck and lower back work harder." }
  - { id: core, label: Spine & core, related: [upper-back, hips, feet], caption: "Lower back pain often traces to hips and feet." }
  - { id: hips, label: Hips, related: [core, knees, feet], caption: "Tight hips change how the back and knees load." }
  - { id: knees, label: Knees, related: [hips, feet], caption: "Knee pain is often a hip or foot story." }
  - { id: feet, label: Feet, related: [knees, hips, core], caption: "How your feet land echoes all the way up to your back." }
