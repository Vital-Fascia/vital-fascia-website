# Wording of the automatic confirmation emails clients receive after using a form on the website.
# (The notification emails to Alex are plain summaries of what the client entered and aren't edited here.)
# {name} in a greeting is replaced with the client's name.

# After "Request a call" (home page)
callRequest:
  subject: "We've received your call request"
  preheader: Alex will call you shortly.
  greeting: Hi {name},
  intro: Thanks for getting in touch. Your request for a free discovery call has come through, and Alex will ring you on the number you gave us.
  stepsHeading: What happens next
  steps:
    - "Alex calls you, on average within 2 hours during clinic hours"
    - "You have a relaxed, no-pressure chat about what's going on"
    - "If it feels right, you arrange your first session together"
  outro: If you'd rather not wait, or need to change your details, just reply to this email or message us on 0449 637 920.
  signOff: Warm regards,
  signature: Alex, Vital Fascia

# After a message sent from the Contact page
contactMessage:
  subject: "Thanks for your message"
  preheader: Alex will get back to you soon.
  greeting: Hi {name},
  intro: Thanks for getting in touch. Your message has come through and Alex will read it personally.
  stepsHeading: What happens next
  steps:
    - "Alex reads your message"
    - "He replies by email, or calls if that's easier"
    - "Together you work out the best next step"
  outro: If it's urgent, you can also message or call us on 0449 637 920.
  signOff: Warm regards,
  signature: Alex, Vital Fascia

# After joining the 8-Week Program waitlist
waitlist:
  subject: "You're on the 8-Week Program waitlist"
  preheader: You'll be first to hear when places open.
  greeting: Hi {name},
  intro: Thanks for your interest in the 8-Week 1:1 Program. You're on the waitlist, so you'll be among the first to hear when places open.
  stepsHeading: What happens next
  steps:
    - "We'll email you as soon as enrolments open"
    - "You'll get first access to the limited spots"
    - "No obligation. You can decide when you hear the details"
  outro: Questions in the meantime? Just reply to this email.
  signOff: Warm regards,
  signature: Alex, Vital Fascia
