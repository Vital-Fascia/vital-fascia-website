visible: true
startOpen: false
eyebrow: The process
heading: A journey, not a quick fix
intro: Six steps, guided by Structural Integration principles, so each session builds on the last and moves you toward independence.
steps:
  - title: Understand
    icon: conversation
    description: A real conversation about your history, your patterns and what you’ve already tried, so we start with the whole picture.
    detail: "What you leave with: a clear picture of what's likely going on."
  - title: Assess
    icon: posture
    description: We look at how you stand, move, breathe and organise yourself around gravity, across your whole body, not just the painful area.
    detail: 'What happens: simple movement and posture checks, head to toe.'
  - title: Release
    icon: hands
    description: Hands-on work that moves from the outer layers inward, easing tension where your body is holding more than it needs to.
    detail: 'What happens: hands-on work matched to what we found.'
  - title: Integrate
    icon: compass
    description: We work on how areas connect, like ribs to pelvis and feet to hips, so your body can share the load more evenly.
    detail: Understanding how your body is interconnected with breathing, movement and rest for long term sustained improvement
  - title: Move
    icon: web
    description: Simple, guided movement to help your body explore new options and carry the session into daily life.
    detail: 'What you leave with: two or three short drills, no gym needed.'
  - title: Empower
    icon: conversation
    description: Tools and understanding to manage your own body, so progress continues long after a session ends.
    detail: A complete process from start to finish.
