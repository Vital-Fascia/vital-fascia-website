# Real Google reviews (docs/Reviews.md). The first 10 are the priority reviews and show first in the slider; drag to reorder in the CMS.
items:
  - { quote: "This is the first time I have had consistent relief and obvious improvement from treatment. My headaches have significantly decreased in frequency and I’m feeling a great reduction of tension in my upper body.", name: "Lucy Sharman", source: Google Review, rating: 5 }
  - { quote: "I've had chronic pain in my back and shoulders for over 5 years. After working with Alex for 4 sessions, the pain is barely there. I feel hopeful and empowered to manage my pain with Alex's home exercises and some follow up sessions.", name: "Ria Adele", source: Google Review, rating: 5 }
  - { quote: "I’ve seen a considerable improvement in pain and strength over our sessions and feel I now have the skills to help treat myself alongside sessions with Alex. Couldn’t recommend him more!", name: "Baxter Laurance", source: Google Review, rating: 5 }
  - { quote: "The complete turnaround from having a terrible hip injury and severe shin splints to now is hard to believe. Alex has played such a crucial role in me getting back into my full running routine.", name: "Emma Steyn", source: Google Review, rating: 5 }
  - { quote: "Alex was friendly, attentive, and comprehensive in his treatment. He gave useful resources, answered all of my questions in detail, and helped me understand what was causing my pain and how to manage it.", name: "Nasim Patel", source: Google Review, rating: 5 }
  - { quote: "I’ve been seriously impressed by his holistic approach and level of skill! He’s thorough, genuinely caring and his treatment plan has transformed how I feel day to day. I couldn’t recommend him more!", name: "Mel Lazarus", source: Google Review, rating: 5 }
  - { quote: "He was very thorough, considerate and explained himself as he went. I competed last weekend pain free so thank you Alex for all your support! Couldn't recommend more!", name: "Rosa H", source: Google Review, rating: 5 }
  - { quote: "Alex is a soft tissue genius! I have had 3 sessions with him and have walked out of the clinic legit feeling a foot taller, looser and more supple. He is super knowledgeable and intuitive and I also appreciate the genuine conversations and connection during the treatment. I have already booked in for my next session. I highly recommend booking in a few sessions with him! Run don’t walk!", name: "Brad Lewis", source: Google Review, rating: 5 }
  - { quote: "His treatment and advice has consistently helped me manage my chronic lower back issues, keeping me active in the gym and on the field.", name: "Josh Baron", source: Google Review, rating: 5 }
  - { quote: "Beyond soft tissue therapy, he provides me methods so I can get relief at home and provides long term guidance to help resolve the underlying issues.", name: "Patrick Gallagher", source: Google Review, rating: 5 }
  - { quote: "Excellent experience here with Alex. Professional, respectful and effective technique. Treatment has provided immediate relief and has helped to limit reoccurrence of pain. Highly recommended.", name: "Mel Smith", source: Google Review, rating: 5 }
  - { quote: "I found Alex to be highly skilled and really listened to my needs, tailoring specifically for my issues. He is always friendly but also professional. I always leave feeling better and the feeling lasts for days! I highly recommend.", name: "Carolyn Day", source: Google Review, rating: 5 }
  - { quote: "Alex is so great at what he does, he always provides a safe space, I've seen HUGE improvements and he's always down for a deep chat. Highly recommend!", name: "Javier Ardino", source: Google Review, rating: 5 }
  - { quote: "I have been seeing Alex when needed over the past 5 months and he is amazing. Very professional, polite and informative. Any niggle I get from crossfit or running he is able to get it sorted and my body is feeling a million times better. Thanks Alex, you’re the best!", name: "Deirdre Cotter", source: Google Review, rating: 5 }
  - { quote: "I have been seeing Alex for chronic shoulder, back and hip pain. He has helped immensely to alleviate symptoms and get me back to exercising without pain. He has an excellent understanding of the body and helps you understand where your pain is coming from. He’s like seeing a physio but better! He checks in with how your body and lifestyle are going, and what areas could be improved. I highly recommend Alex for anyone looking for pain relief, advice and a fresh set of eyes to stop pain reoccurring.", name: "Courtney Maher", source: Google Review, rating: 5 }
  - { quote: "Alex has been incredibly knowledgeable and effective, solving my back issues and other injuries that have cropped up. Highly recommend!", name: "Reese Mortlock", source: Google Review, rating: 5 }
  - { quote: "I had trouble with my shoulder having constant sporadic pain, also with a bad knee, my friend refer me to Alex M and since seeing him I have improve so much, currently training for a triathlon and helping after workout sessions, can’t recommend him enough", name: "Horacio Villarreal", source: Google Review, rating: 5 }
  - { quote: "Five stars for Alex! I had such a great experience. I went in with a really sore shoulder and he knew exactly where to focus. He was incredibly thorough, professional and clearly very experienced. My shoulder felt so much better afterwards and the improvement has lasted. I’m so grateful and will definitely be going back. Highly recommend!", name: "Sally C", source: Google Review, rating: 5 }
  - { quote: "Feeling so much more relief since my session with Alex today. I really appreciate his professionalism and time he took to help me understand my body better and the root behaviours that might be exacerbating my symptoms. Thank you so much Alex! Highly recommend!", name: "James Webb", source: Google Review, rating: 5 }
  - { quote: "Alex has helped me to regain movement and assisted with exercises in between sessions. A genuine 5 star review.", name: "Emma Gooding", source: Google Review, rating: 5 }
  - { quote: "A year ago I had trouble walking due to hip problems. Since I started seeing Alex I've gone from strength to strength. Can't recommend him enough. Five stars.", name: "Jeremy Daniels", source: Google Review, rating: 5 }
  - { quote: "Thorough and excellent remedial treatment. Alex is fantastic.", name: "Richard Desroches", source: Google Review, rating: 5 }
