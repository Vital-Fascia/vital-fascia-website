visible: true
eyebrow: Who it's for
heading: Does this sound like you?
intro: You've tried stretching, foam rolling, maybe a few different clinics, and the same tightness keeps finding its way back.
signs:
  - Recurring pain that shifts around but never fully resolves
  - Chronic tension in the neck, shoulders or lower back
  - Stiffness that's worse first thing in the morning, or after a day at a desk
  - Posture you're aware of but can't seem to change
  - Movement that feels restricted, guarded or permanently "tight"
  - The frustration of trying everything without understanding why
closing: If any of this sounds familiar, it's rarely about the sore spot on its own. It's a pattern, and patterns can be understood.
