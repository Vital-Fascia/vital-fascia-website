eyebrow: About Alex
heading: The guy behind Vital Fascia
paragraphs:
  - "Alex May started out treating symptoms like most therapists do: the sore shoulder, the tight hip, the nagging lower back. What changed everything was noticing how rarely the sore spot was actually the cause."
  - "Vital Fascia grew out of that shift: a practice built on understanding the whole system, not just soothing the loudest part of it. Alex is based in Double Bay and works with desk workers, runners, gym-goers and anyone whose body has been trying to tell them something for a while."
  # TODO: the "nine in ten clients" claim below is from the design prototype and is NOT confirmed. Verify or delete.
  - "Today, roughly nine in ten clients report a noticeable improvement in how they move within their first month of working together, and leave with a better understanding of why."
