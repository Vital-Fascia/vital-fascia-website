eyebrow: About Alex
heading: The person behind Vital Fascia
pullQuote: The sore spot is rarely the cause. It's just the loudest part of the story.
paragraphs:
  - 'I started out focusing on where it hurt: the sore shoulder, the tight hip, the nagging lower back. Over time, I kept noticing that the sore spot was often only part of the picture, and that how someone moved, breathed and held themselves mattered just as much.'
  - 'Vital Fascia grew out of that shift: a practice built on understanding the whole system, not just soothing the loudest part of it. I’m based in Sydney CBD and Double Bay, and I work with desk workers, runners, gym-goers and anyone whose body has been trying to tell them something for a while.'
