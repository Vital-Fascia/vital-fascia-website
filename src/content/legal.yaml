privacy:
  title: Privacy Policy
  intro: |
    **Effective date: April 2025**

    Vital Fascia respects your privacy and is committed to safeguarding your personal information in accordance with the Australian Privacy Principles (APPs) outlined in the Privacy Act 1988 (Cth).

    This Privacy Policy explains how we collect, use, store, disclose, and protect your personal information when you interact with our clinic, website, and services.
  sections:
    - heading: 1. What personal information we collect
      body: |
        We may collect the following types of information:

        - Your full name, date of birth, and contact details (address, phone, email)
        - Health-related information including treatment history, symptoms, medical conditions, and other clinical notes
        - Payment and billing details
        - Online interactions via cookies, IP address, and browsing behaviour on our website
    - heading: 2. How we collect personal information
      body: |
        We collect your personal information through:

        - Intake forms and treatment notes
        - Phone, email, SMS, and online booking systems
        - Website forms or when you contact us via our digital platforms
        - In-person conversations during consultations or therapy sessions
    - heading: 3. Why we collect your information
      body: |
        We collect your information to:

        - Provide personalised soft tissue therapy, myofascial release, and health services
        - Maintain accurate treatment records
        - Contact you about appointments, follow-ups, or treatment plans
        - Process payments and manage clinic operations
        - Comply with legal obligations and industry regulations
    - heading: 4. Disclosure of your information
      body: |
        Your information may be disclosed:

        - To authorised third-party service providers (e.g., practice management software, email/SMS tools) strictly for the purpose of delivering our services
        - If required by law or to protect the safety of any individual
        - With your explicit consent, for referrals or coordinated care with other practitioners

        **We will never sell or rent your personal data to third parties.**
    - heading: 5. How we store and protect your information
      body: |
        We take reasonable steps to protect your information from misuse, loss, unauthorised access, or disclosure. This includes:

        - Secure electronic storage using encrypted platforms
        - Password-protected clinic software and databases
        - Restricting access to staff and authorised personnel only

        If your data is no longer needed, we will take reasonable steps to destroy or de-identify it.
    - heading: 6. Access and correction of personal information
      body: |
        You may request access to or correction of your personal information at any time. We will respond within a reasonable timeframe and may require proof of identity before releasing information.

        To request access or a correction, please email: [alex@vitalfascia.com.au](mailto:alex@vitalfascia.com.au)
    - heading: 7. Cookies and website analytics
      body: |
        Our website may use cookies and analytics tools to improve user experience. These tools collect non-identifying information such as pages visited, time spent on site, and device type. You can disable cookies in your browser settings.
    - heading: 8. Marketing and communications
      body: |
        We may send you relevant updates, offers, or educational content via email or SMS. You can opt out at any time by clicking "unsubscribe" or contacting us directly.
    - heading: 9. Making a complaint
      body: |
        If you believe your privacy has been breached, please contact us immediately. We take all complaints seriously and will respond within a reasonable timeframe.

        **Contact details:**  
        Vital Fascia  
        [alex@vitalfascia.com.au](mailto:alex@vitalfascia.com.au)  
        0449 637 920  
        Suite 6/21-25 Knox St, Double Bay NSW 2028

        If you are not satisfied with our response, you can contact the Office of the Australian Information Commissioner (OAIC):  
        [www.oaic.gov.au](https://www.oaic.gov.au/)  
        1300 363 992
    - heading: 10. Policy updates
      body: |
        We may update this Privacy Policy from time to time to reflect changes in law or practice. The latest version will always be available on our website.
cancellation:
  title: Cancellation Policy
  intro: |
    **We understand that life doesn’t always go to plan.**

    Each appointment is time set aside for you, and when a session is cancelled at short notice, it often can’t be offered to someone else who needs care. This policy helps us keep appointments available for everyone, and keeps our fees fair for all clients.
  sections:
    - heading: How it works
      body: |
        **12+ hours’ notice:** No charge. We’ll happily help you find a new time that suits.

        **Between 4 and 12 hours’ notice:** A partial fee applies ($90). We’ll still do our best to offer your appointment to someone on our waitlist.

        **4 hours’ notice or less, or no-show:** The full appointment fee applies, as we’re very unlikely to fill the time at this point.
    - heading: Cancellation fees
      body: |
        | Notice given | Fee |
        | --- | --- |
        | 12 hours or more | No charge |
        | More than 4, less than 12 hours | $90 |
        | 0–4 hours / No-show | Full appointment fee |
    - heading: Good to know
      body: |
        - **How to cancel or reschedule:** Use the link in your confirmation email or reminder, or contact us directly at 0449 637 920.
        - **Payment:** Any cancellation fee will be invoiced and must be settled before your next appointment.
        - **Health fund rebates:** Cancellation fees can’t be claimed through private health insurance.
        - **Late arrivals:** If you arrive late, we’ll do what we can, but your session may need to finish at the scheduled time so the next client isn’t affected. The full fee still applies.
        - **Feeling unwell?** Please don’t push through. If you have a contagious illness, let us know as early as possible and we’ll work with you.
        - **Genuine emergencies:** We know some things are out of anyone’s control. Unexpected situations are considered case by case, at our discretion.

        **Thanks for helping us look after you, and every other client who relies on us.**
